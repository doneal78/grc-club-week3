# grc-gate: run the policy gate on every pull request.
name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -L -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin
          conftest --version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Run policy gate
        id: gate
        run: |
          mkdir -p evidence
          set +e
          conftest test --policy policies --namespace compliance.sc28_aws plan.json --output json > evidence/sc28-results.json
          sc28_exit=$?
          conftest test --policy policies --namespace compliance.ac3_aws plan.json --output json > evidence/ac3-results.json
          ac3_exit=$?
          conftest test --policy policies --namespace compliance.cm6_aws plan.json --output json > evidence/cm6-results.json
          cm6_exit=$?
          jq -s '{sc28: .[0], ac3: .[1], cm6: .[2]}' evidence/sc28-results.json evidence/ac3-results.json evidence/cm6-results.json > evidence/conftest-results.json